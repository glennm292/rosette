# Machine-readable manifest for this template. The sibling
# template.md holds the prose, the Requirements list, and the two
# append-only history logs; this file is authoritative for everything
# below. Both are generated together -- validate_template.py fails if
# they disagree.
format = "v2"

[template]
slug = "rosette"
title = "Rosette"
description = "A two-column notebook for language class: your notes and work on the left, automatic translations and corrections on the right. Runs inside Mind, or standalone with your own Anthropic API key."
thumbnail = "template.svg"
version = "v3"

# How this template is DERIVED from the workspace it came from. An
# update re-runs this recipe rather than diffing two repos, which is what
# keeps an exclusion excluded even though the thing still exists upstream.
[recipe]
include = ["system/apps/rosette", "system/supervisord.conf.d/rosette.conf"]
data_include = []
# The publishing user's own class notes, and the lines they cleared.
# Personal content; never ships. The app writes a
# fresh, empty notebook on first run.
exclude = ["data/.apps/rosette"]
# The app code carries nothing personal -- no names, accounts, notes or
# keys -- so the published version is the source version.
modification_rules = []

# Everything an adopter must deal with before this is really theirs.
# One list -- but each entry's KIND says how it is handled, because the
# two are handled at different times by different mechanisms:
#
#   permission / secret / llm = ACTIVATION. The adopting agent acts on
#   these FIRST and BY ITSELF, initiating each latchkey permission
#   request before asking the user anything. Every one of them must have
#   a matching requires_ line in template.md and vice versa -- the
#   validator checks that, because an adopter once never got prompted
#   for a permission the app needed.
#
#   adaptation = worked through INTERACTIVELY with the user afterwards.
#   Prose on both sides, so it is not cross-checked.
#
# This app needs LLM access and nothing else: no latchkey permission, no
# third-party account and no required secret. An Anthropic API key is
# optional (it is how the app runs outside a Mind), so it is described under
# `llm` rather than declared as a secret. `permission`, `secret` and
# `adaptation` are all genuinely empty and only `llm` is declared.
[requirements]

[requirements.llm]
method = "keyed or keyless"
note = """\
Runs on either route and picks one per call; nothing to switch. With an \
Anthropic API key it calls the API directly via litellm (keyed): the key is \
read from ANTHROPIC_API_KEY first, then from the file the page writes into the \
app's own data directory when the user enters one under "Speed this up". With \
neither it falls back to the keyless `claude -p` subscription route, via the \
`claude_p.py` copy vendored into `system/apps/rosette/src/rosette/`. No key is \
required inside a Mind already signed in to Claude; a key is what lets the app \
run standalone, outside one.\
"""

# What the included code needs INSTALLED. apt takes bare names: versions
# are a function of the apt snapshot timestamp, so replaying names at the
# adopter's timestamp yields versions consistent with the rest of their
# environment. The other sources are not snapshot-pinned, so for them the
# recorded version IS the pin (name = version).
#
# Nothing to install. The app's dependencies are ordinary Python packages
# declared in system/apps/rosette/pyproject.toml (flask, flask-sock, litellm,
# loguru, pydantic, werkzeug), and the only binary it shells out to is the
# `claude` CLI the workspace already ships (keyless route only). Empty by
# design, not by omission.
#
# (The page also pulls two webfonts from Google Fonts at runtime and falls
# back to system serif/sans without network -- a runtime fetch, not an
# install, so it is not declared here.)
[environment]
apt = []
env_d_units = []
