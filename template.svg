<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 160" width="240" height="160" role="img" aria-label="Rosette: a two-column language notebook, with a student's Italian lines on the left and red-pen corrections in the right margin">
  <title>Rosette</title>

  <!-- the page -->
  <rect width="240" height="160" rx="12" fill="#fcfbf8"/>
  <rect x="0.6" y="0.6" width="238.8" height="158.8" rx="11.4" fill="none" stroke="#e7e2d6" stroke-width="1.2"/>

  <!-- title, and the language it is set to -->
  <text x="16" y="27" font-family="Georgia, 'Times New Roman', serif" font-size="13.5" fill="#1b2430">Rosette</text>
  <text x="68" y="27" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#66707f">Italian</text>
  <path d="M96 23.4 l3.4 0 -1.7 2.6 z" fill="#9aa3ae"/>
  <line x1="16" y1="36" x2="224" y2="36" stroke="#cbd8e4" stroke-width="0.8"/>

  <!-- the red margin rule: my page on the left, the teacher's margin on the right -->
  <line x1="118" y1="42" x2="118" y2="146" stroke="#c8362b" stroke-width="1.3" opacity="0.6"/>

  <!-- ruled lines I write on -->
  <g stroke="#cbd8e4" stroke-width="0.7">
    <line x1="16" y1="60" x2="110" y2="60"/>
    <line x1="16" y1="84" x2="110" y2="84"/>
    <line x1="16" y1="108" x2="110" y2="108"/>
    <line x1="16" y1="132" x2="110" y2="132"/>
  </g>

  <!-- what I wrote -->
  <g font-family="Georgia, 'Times New Roman', serif" font-size="9.5" fill="#1b2430">
    <text x="16" y="57">Ieri ho andato</text>
    <text x="16" y="81">a la scuola.</text>
    <text x="16" y="105">Mi piace il caffè</text>
  </g>
  <line x1="16.5" y1="122" x2="16.5" y2="130" stroke="#1b2430" stroke-width="1"/>

  <!-- the red pen: my wrong words struck through, the replacement beside them -->
  <text x="126" y="57" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#66707f">ho andato</text>
  <line x1="124.5" y1="54.3" x2="160.5" y2="54.3" stroke="#c8362b" stroke-width="1"/>
  <text x="168" y="57" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#c8362b">sono andato</text>

  <text x="126" y="70" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#66707f">a la</text>
  <line x1="124.5" y1="67.3" x2="140" y2="67.3" stroke="#c8362b" stroke-width="1"/>
  <text x="146" y="70" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#c8362b">alla</text>

  <g font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#9aa3ae">
    <text x="126" y="82">andare takes essere,</text>
    <text x="126" y="91">and a + la becomes alla.</text>
  </g>

  <!-- and a line that needed nothing -->
  <text x="126" y="105" font-family="Helvetica, Arial, sans-serif" font-size="7.5" fill="#3f7d58">All correct</text>
  <g font-family="Helvetica, Arial, sans-serif" font-size="6.5" fill="#9aa3ae">
    <text x="126" y="117">piacere agrees with the</text>
    <text x="126" y="126">coffee, not with you.</text>
  </g>
</svg>
