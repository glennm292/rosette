[project]
name = "rosette"
version = "0.1.0"
description = "Two-column language-class notebook: your notes on the left, translations and corrections on the right"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "loguru>=0.7",
    "pydantic>=2",
    "werkzeug>=3.0",
]

[project.scripts]
rosette = "rosette.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosette"]
