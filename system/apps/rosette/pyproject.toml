[project]
name = "rosette"
version = "0.1.0"
description = "Two-column language-class notebook: your notes on the left, translations and corrections on the right"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "flask-sock>=0.7",
    "litellm>=1.50",
    "loguru>=0.7",
    "pydantic>=2",
    "werkzeug>=3.0",
]

[project.scripts]
rosette = "rosette.runner:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rosette"]

# Makes this directory ty's project; without a [tool.ty] table ty keeps searching upward.
[tool.ty]

[tool.uv]
# Supply-chain cooldown, the workspace root's window: a registry release is adopted
# once it has been public this long, so a compromised one can be yanked first.
exclude-newer = "14 days"

[dependency-groups]
dev = [
    "ty==0.0.87",
    "imbue-common[testing]",
]

[tool.pytest.ini_options]
testpaths = ["."]

[tool.uv.sources]
imbue-common = { git = "https://github.com/imbue-ai/mngr", rev = "1a3f05d2077631ad0b43e1be3cec50fc5dc37749", subdirectory = "libs/imbue_common" }
