[program:rosette]
command=python3 system/services/oom_priority/bin/oom_tag_service.py user bash -c "python3 system/scripts/workspace_bare_scripts/venv_links.py ensure-project system/apps/rosette && uv sync --locked --project system/apps/rosette && python3 system/scripts/forward_port.py --manifest system/apps/rosette/app.toml --url http://localhost:8082 && exec system/apps/rosette/.venv/bin/rosette"
directory=/home/user/workspace
autostart=true
autorestart=true
startretries=1000000
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/rosette-stdout.log
stderr_logfile=/var/log/supervisor/rosette-stderr.log
stdout_logfile_maxbytes=10MB
stderr_logfile_maxbytes=10MB
stdout_logfile_backups=3
stderr_logfile_backups=3
